<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">DevOps Portfolio Platform Architecture</title>
  <desc id="desc">CI/CD, Kubernetes progressive delivery, Terraform remote state, and observability control loop</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F2A"/>
      <stop offset="55%" stop-color="#0B3D5C"/>
      <stop offset="100%" stop-color="#1F6F8B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7FA"/>
      <stop offset="100%" stop-color="#E4EEF3"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001018" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#F7B538"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <circle cx="1200" cy="80" r="180" fill="#F7B538" opacity="0.08"/>
  <circle cx="80" cy="700" r="140" fill="#7BA3B5" opacity="0.12"/>

  <text x="56" y="58" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">DevOps Portfolio · Platform Architecture</text>
  <text x="56" y="90" fill="#B7D0DC" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15">CI/CD quality gates · multi-stage containers · progressive delivery · remote state · incident response</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="130" width="310" height="360" rx="18" fill="url(#card)"/>
    <rect x="48" y="130" width="310" height="10" rx="4" fill="#F7B538"/>
    <text x="72" y="175" fill="#0B3D5C" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">01  CI/CD PLATFORM</text>
    <rect x="72" y="200" width="260" height="48" rx="10" fill="#0B3D5C"/>
    <text x="92" y="230" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14">GitHub Actions</text>
    <rect x="72" y="265" width="260" height="48" rx="10" fill="#1F6F8B"/>
    <text x="92" y="295" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14">Tests · Config gate · Build</text>
    <rect x="72" y="330" width="260" height="48" rx="10" fill="#0B3D5C"/>
    <text x="92" y="360" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14">Multi-stage OCI · non-root</text>
    <rect x="72" y="395" width="260" height="48" rx="10" fill="#8B1E3F"/>
    <text x="92" y="425" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14">Fail closed on bad gates</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="390" y="130" width="310" height="360" rx="18" fill="url(#card)"/>
    <rect x="390" y="130" width="310" height="10" rx="4" fill="#1F6F8B"/>
    <text x="414" y="175" fill="#0B3D5C" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">02  PROGRESSIVE DELIVERY</text>
    <rect x="414" y="200" width="260" height="42" rx="10" fill="#1F6F8B"/>
    <text x="434" y="227" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">DNS · ALB/Ingress · Service</text>
    <rect x="414" y="258" width="120" height="70" rx="10" fill="#0B3D5C"/>
    <text x="434" y="300" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">stable</text>
    <rect x="554" y="258" width="120" height="70" rx="10" fill="#0B3D5C"/>
    <text x="570" y="300" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">canary</text>
    <polygon points="544,370 604,340 664,370 604,420" fill="#F7B538"/>
    <text x="560" y="378" fill="#0B1F2A" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">error gate</text>
    <text x="414" y="460" fill="#2C5364" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12">promote  or  auto-rollback</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="732" y="130" width="310" height="170" rx="18" fill="url(#card)"/>
    <rect x="732" y="130" width="310" height="10" rx="4" fill="#0B3D5C"/>
    <text x="756" y="175" fill="#0B3D5C" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">03  TERRAFORM STATE</text>
    <rect x="756" y="195" width="260" height="40" rx="10" fill="#0B3D5C"/>
    <text x="776" y="221" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">S3 versioned state + SSE</text>
    <rect x="756" y="245" width="260" height="40" rx="10" fill="#1F6F8B"/>
    <text x="776" y="271" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">DynamoDB lock table</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="732" y="320" width="310" height="170" rx="18" fill="url(#card)"/>
    <rect x="732" y="320" width="310" height="10" rx="4" fill="#8B1E3F"/>
    <text x="756" y="365" fill="#0B3D5C" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">04  OBSERVABILITY</text>
    <rect x="756" y="385" width="260" height="40" rx="10" fill="#0B3D5C"/>
    <text x="776" y="411" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">Prometheus · Grafana</text>
    <rect x="756" y="435" width="260" height="40" rx="10" fill="#8B1E3F"/>
    <text x="776" y="461" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">Synthetic failure ’ RCA</text>
  </g>

  <!-- Control loop banner -->
  <g filter="url(#shadow)">
    <rect x="48" y="530" width="994" height="110" rx="18" fill="#071822" stroke="#F7B538" stroke-width="2"/>
    <text x="72" y="570" fill="#F7B538" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">CONTROL LOOP</text>
    <text x="72" y="605" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15">Commit ’ Gates ’ Artifact ’ Canary split ’ Error-rate eval ’ Promote / Rollback ’ Learn</text>
  </g>

  <!-- Side legend -->
  <g>
    <rect x="1070" y="130" width="280" height="360" rx="18" fill="#071822" opacity="0.85"/>
    <text x="1095" y="175" fill="#F7B538" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Interview signals</text>
    <text x="1095" y="215" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">" Fail-closed quality gates</text>
    <text x="1095" y="245" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">" Measured image hygiene</text>
    <text x="1095" y="275" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">" Canary + auto-rollback</text>
    <text x="1095" y="305" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">" Remote state concurrency</text>
    <text x="1095" y="335" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">" IAM / secrets boundaries</text>
    <text x="1095" y="365" fill="#F4F7FA" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">" Incident detect’recover</text>
    <text x="1095" y="420" fill="#B7D0DC" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12">Editable: Mermaid + draw.io</text>
    <text x="1095" y="445" fill="#B7D0DC" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12">No proprietary employer IP</text>
  </g>

  <text x="56" y="740" fill="#7BA3B5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12">Independent reference architecture for interview discussion · not a copy of employer systems</text>
</svg>
