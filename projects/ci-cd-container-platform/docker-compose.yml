services:
  checkout-api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["dev"]
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: dev
      APP_CONFIG_PATH: /app/configs/dev.json
      APP_READY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  checkout-api-sit:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["sit"]
    ports:
      - "8081:8080"
    environment:
      APP_ENVIRONMENT: sit
      APP_CONFIG_PATH: /app/configs/sit.json
      APP_READY: "true"

  checkout-api-uat:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["uat"]
    ports:
      - "8082:8080"
    environment:
      APP_ENVIRONMENT: uat
      APP_CONFIG_PATH: /app/configs/uat.json
      APP_READY: "true"
