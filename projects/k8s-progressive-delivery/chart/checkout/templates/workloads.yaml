apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-stable
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/component: stable
    app.kubernetes.io/version: {{ .Values.stable.version | quote }}
spec:
  replicas: {{ .Values.stable.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
      app.kubernetes.io/component: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/component: stable
        app.kubernetes.io/version: {{ .Values.stable.version | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_ENVIRONMENT
              value: prod
            - name: APP_VERSION
              value: {{ .Values.stable.version | quote }}
            - name: APP_READY
              value: "true"
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: SYNTHETIC_ERROR_RATE
              value: {{ .Values.stable.errorRate | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
