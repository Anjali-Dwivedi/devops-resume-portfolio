apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-stable
  namespace: checkout
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/component: stable
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
      app.kubernetes.io/component: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/component: stable
        app.kubernetes.io/version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-api
          image: checkout-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENVIRONMENT
              value: prod
            - name: APP_VERSION
              value: v1
            - name: APP_READY
              value: "true"
            - name: DATABASE_URL
              value: postgresql://checkout:example@db.internal:5432/checkout
            - name: SYNTHETIC_ERROR_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
