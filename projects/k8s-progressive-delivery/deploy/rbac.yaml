apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-deployer
  namespace: checkout
  labels:
    app.kubernetes.io/name: checkout-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkout-deployer
  namespace: checkout
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkout-deployer
  namespace: checkout
subjects:
  - kind: ServiceAccount
    name: checkout-deployer
    namespace: checkout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: checkout-deployer
